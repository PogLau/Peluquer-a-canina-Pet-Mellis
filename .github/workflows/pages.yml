# Publica la demo interactiva de Pet Mellis en GitHub Pages en cada push a main.
# La demo es un sitio estático (pnpm build:demo): los datos son ficticios y viven en el navegador
# de cada visitante. No hace falta servidor, base de datos ni variables secretas. Ver docs/demo.md.

name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npx --yes pnpm@12.21.0 install --frozen-lockfile

      - name: Typecheck y tests
        run: |
          npx --yes pnpm@12.21.0 typecheck
          npx --yes pnpm@12.21.0 test

      - name: Construir la demo estática
        env:
          # GitHub Pages sirve el sitio bajo /<nombre-del-repo>/
          DEMO_BASE_PATH: /${{ github.event.repository.name }}
        run: npx --yes pnpm@12.21.0 build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .next-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
